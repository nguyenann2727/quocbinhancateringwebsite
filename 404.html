<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#173b35" />
    <title>Không tìm thấy trang | Quốc Bình An</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #173b35; color: #fff; }
      main { width: min(620px, 100%); text-align: center; }
      small { color: #8ee7d6; font-weight: 700; letter-spacing: .14em; }
      h1 { margin: 18px 0 12px; font-size: clamp(38px, 8vw, 72px); line-height: 1; }
      p { margin: 0 auto 28px; max-width: 520px; color: rgba(255,255,255,.76); line-height: 1.7; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 22px; border-radius: 999px; background: #8ee7d6; color: #173b35; font-weight: 750; text-decoration: none; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <small>QUỐC BÌNH AN · 404</small>
      <h1>Không tìm thấy trang</h1>
      <p>Địa chỉ bạn truy cập không tồn tại hoặc đã được di chuyển.</p>
      <a href="/">Trở về trang chủ</a>
    </main>
  </body>
</html>
